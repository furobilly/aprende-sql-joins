<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende SQL Joins - Simulador Interactivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="mb-8 text-center border-b border-slate-700 pb-6">
            <h1 class="text-3xl md:text-4xl font-bold text-emerald-400 mb-2">⚡ Aprende SQL Joins</h1>
            <p class="text-slate-400 text-base">Masterclass Interactiva &amp; Desglose Paso a Paso</p>
        </header>

        <nav class="flex flex-wrap gap-2 mb-6 border-b border-slate-700 pb-3" id="tabs-container">
            <button onclick="cambiarReto(1)" id="tab-1" class="tab-btn bg-emerald-600 text-white px-4 py-2 rounded-lg font-medium transition">Reto 1: LEFT JOIN</button>
            <button onclick="cambiarReto(2)" id="tab-2" class="tab-btn bg-slate-800 text-slate-400 hover:bg-slate-700 px-4 py-2 rounded-lg font-medium transition">Reto 2: INNER JOIN</button>
            <button onclick="cambiarReto(3)" id="tab-3" class="tab-btn bg-slate-800 text-slate-400 hover:bg-slate-700 px-4 py-2 rounded-lg font-medium transition">Reto 3: RIGHT JOIN</button>
        </nav>

        <section class="bg-slate-800/80 border border-slate-700 rounded-xl p-5 mb-6">
            <details class="group" open>
                <summary class="flex justify-between items-center font-bold text-lg text-emerald-300 cursor-pointer list-none">
                    <span>🩺 Descomposición Quirúrgica del Ejercicio</span>
                    <span class="transition group-open:rotate-180">▼</span>
                </summary>
                <div class="mt-4 text-slate-300 text-sm leading-relaxed space-y-3 border-t border-slate-700 pt-3" id="desglose-teorico">
                    </div>
            </details>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-bold text-slate-100 mb-2" id="titulo-reto">Cargando Reto...</h2>
                    <p class="text-slate-400 text-sm mb-4" id="desc-reto">Sigue las instrucciones para resolver la consulta.</p>

                    <label for="codigo-sql" class="block text-xs font-semibold uppercase text-slate-400 mb-1">Escribe tu Consulta SQL:</label>
                    <textarea id="codigo-sql" rows="6" class="w-full bg-slate-950 text-emerald-400 font-mono p-3 rounded-lg border border-slate-700 focus:outline-none focus:border-emerald-500 text-sm" spellcheck="false"></textarea>
                </div>

                <div class="mt-4 flex gap-3">
                    <button onclick="ejecutarConsulta()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 px-4 rounded-lg transition shadow-lg">
                        ▶ Ejecutar Consulta
                    </button>
                </div>
            </div>

            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 flex flex-col">
                <h3 class="text-lg font-bold text-slate-200 mb-3">Resultado de la Consulta</h3>
                <div id="resultado-container" class="flex-1 bg-slate-950 border border-slate-700 rounded-lg p-3 overflow-x-auto min-h-[200px] text-xs font-mono">
                    <p class="text-slate-500 italic">Haz clic en "Ejecutar Consulta" para ver los datos...</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Datos de los Retos y Desgloses Teóricos
        const retos = {
            1: {
                titulo: "Reto 1: Clientes y sus Pedidos (LEFT JOIN)",
                descripcion: "Obtén todos los clientes y sus pedidos asociados, incluyendo aquellos clientes que aún no han realizado compras.",
                sqlInicial: "SELECT c.nombre, p.producto, p.monto\nFROM Clientes c\nLEFT JOIN Pedidos p ON c.id = p.id_cliente;",
                desglose: `
                    <p><strong>Paso 1 (Tabla Principal):</strong> Necesitamos la lista completa de <code>Clientes</code> (deben salir todos, compren o no).</p>
                    <p><strong>Paso 2 (Alias):</strong> Asignamos <code>c</code> para Clientes y <code>p</code> para Pedidos.</p>
                    <p><strong>Paso 3 (Tipo de JOIN):</strong> Usamos <code>LEFT JOIN</code> porque no queremos perder los clientes de la tabla izquierda que tienen 0 compras.</p>
                    <p><strong>Paso 4 (Puente/Llaves):</strong> La conexión es <code>c.id = p.id_cliente</code>.</p>
                `
            },
            2: {
                titulo: "Reto 2: Compras Confirmadas (INNER JOIN)",
                descripcion: "Obtén ÚNICAMENTE los clientes que tienen al menos un pedido registrado.",
                sqlInicial: "SELECT c.nombre, p.producto, p.monto\nFROM Clientes c\nINNER JOIN Pedidos p ON c.id = p.id_cliente;",
                desglose: `
                    <p><strong>Paso 1 (Tabla Principal):</strong> Buscamos coincidencia exacta entre ambas tablas.</p>
                    <p><strong>Paso 2 (Tipo de JOIN):</strong> Usamos <code>INNER JOIN</code> para descartar clientes sin compras y pedidos sin cliente.</p>
                    <p><strong>Paso 3 (Puente/Llaves):</strong> Conexión <code>c.id = p.id_cliente</code>.</p>
                `
            },
            3: {
                titulo: "Reto 3: Análisis de Pedidos (RIGHT JOIN)",
                descripcion: "Obtén todos los pedidos registrados y los datos de sus clientes si existen.",
                sqlInicial: "SELECT c.nombre, p.producto, p.monto\nFROM Clientes c\nRIGHT JOIN Pedidos p ON c.id = p.id_cliente;",
                desglose: `
                    <p><strong>Paso 1 (Tabla Principal):</strong> La prioridad la tiene la tabla de la derecha (<code>Pedidos</code>).</p>
                    <p><strong>Paso 2 (Tipo de JOIN):</strong> Usamos <code>RIGHT JOIN</code> para asegurar que ningún pedido se quede fuera de la consulta.</p>
                `
            }
        };

        let db = null;
        let retoActual = 1;

        // Inicialización de la Base de Datos SQLite en WebAssembly
        async function initDB() {
            try {
                const SQL = await initSqlJs({
                    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
                });
                db = new SQL.Database();

                // Crear tablas y datos de prueba
                db.run(`
                    CREATE TABLE Clientes (id INT, nombre TEXT);
                    INSERT INTO Clientes VALUES (101, 'Ana'), (102, 'Carlos'), (103, 'Beatriz'), (104, 'David');

                    CREATE TABLE Pedidos (id INT, id_cliente INT, producto TEXT, monto INT);
                    INSERT INTO Pedidos VALUES (1, 101, 'Laptop', 1200), (2, 101, 'Mouse', 25), (3, 102, 'Teclado', 80);
                `);

                cambiarReto(1);
            } catch (err) {
                console.error("Error al inicializar la base de datos:", err);
                document.getElementById('resultado-container').innerHTML = `<p class="text-red-400">Error de carga: ${err.message}</p>`;
            }
        }

        // Cambiar entre Retos sin congelar la pantalla
        function cambiarReto(numero) {
            retoActual = numero;
            const data = retos[numero];

            // Actualizar botones de pestañas
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                if (idx + 1 === numero) {
                    btn.className = "tab-btn bg-emerald-600 text-white px-4 py-2 rounded-lg font-medium transition shadow";
                } else {
                    btn.className = "tab-btn bg-slate-800 text-slate-400 hover:bg-slate-700 px-4 py-2 rounded-lg font-medium transition";
                }
            });

            // Actualizar interfaz
            document.getElementById('titulo-reto').innerText = data.titulo;
            document.getElementById('desc-reto').innerText = data.descripcion;
            document.getElementById('codigo-sql').value = data.sqlInicial;
            document.getElementById('desglose-teorico').innerHTML = data.desglose;
            
            // Limpiar resultados anteriores
            document.getElementById('resultado-container').innerHTML = '<p class="text-slate-500 italic">Haz clic en "Ejecutar Consulta" para probar...</p>';
        }

        // Ejecutar la consulta escrita por el usuario
        function ejecutarConsulta() {
            if (!db) {
                alert("La base de datos aún se está cargando. Por favor espera 2 segundos.");
                return;
            }

            const query = document.getElementById('codigo-sql').value;
            const container = document.getElementById('resultado-container');

            try {
                const res = db.exec(query);
                if (res.length === 0) {
                    container.innerHTML = '<p class="text-yellow-400">La consulta se ejecutó con éxito pero no devolvió filas.</p>';
                    return;
                }

                const columns = res[0].columns;
                const values = res[0].values;

                let html = '<table class="w-full text-left border-collapse"><thead><tr class="border-b border-slate-700 text-emerald-400">';
                columns.forEach(col => html += `<th class="p-2">${col}</th>`);
                html += '</tr></thead><tbody>';

                values.forEach(row => {
                    html += '<tr class="border-b border-slate-800/50 hover:bg-slate-900/50">';
                    row.forEach(val => {
                        html += `<td class="p-2 ${val === null ? 'text-slate-600 italic' : 'text-slate-200'}">${val === null ? 'NULL' : val}</td>`;
                    });
                    html += '</tr>';
                });

                html += 'tbody></table>';
                container.innerHTML = html;

            } catch (err) {
                container.innerHTML = `<p class="text-red-400 font-semibold">❌ Error de SQL:</p><p class="text-red-300 mt-1">${err.message}</p>`;
            }
        }

        // Cargar base de datos al abrir la página
        window.onload = initDB;
    </script>
</body>
</html>
